# 多实例部署的覆盖配置。
#
# 默认的 docker-compose.yml 是单实例形态：API 直接映射端口对外服务，组件最少。
# 需要多实例（或者想让多个 worker 并行消费）时，把这个文件一起带上：
#
#   docker compose -f docker-compose.yml -f docker-compose.ha.yml \
#     up -d --scale zhiyu=3 --scale arq-worker-agent=2
#
# 它只做两件事：
#   1. 清掉 API 的宿主端口映射——3 个副本绑同一个端口会直接报冲突
#   2. 起 nginx 作为唯一入口，把请求轮询到各副本（配置见 nginx/nginx.conf）

services:
  zhiyu:
    # !reset 是 Compose 的合并指令：列表默认是**追加**语义，光写 ports: []
    # 不会清掉主文件里的映射，必须显式重置。需要 Compose v2.24+。
    ports: !reset []

  # 负载均衡层。多实例下才有意义——单实例时它是纯粹多出来的一跳。
  #
  # 不用 nginx 镜像自带的默认配置：需要 resolver 做动态解析（--scale 出来的
  # 副本才能被发现）、放大 SSE 的读超时（一次 Agent 运行最长 180 秒）、
  # 关掉事件流的缓冲（否则前端收不到实时输出）。
  nginx:
    image: nginx:alpine
    ports:
      - "${PORT:-8337}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - zhiyu
    restart: unless-stopped
