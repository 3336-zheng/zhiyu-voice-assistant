# 智语 CI - PR 自动检查
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # 代码质量检查
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8
        run: |
          # 只检查错误，不检查警告
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # 显示警告但不失败
          flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # 单元测试
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # 启用 pip 缓存

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 移除 Windows 专用的 python-magic-bin，Linux 用 python-magic
          sed '/python-magic-bin/d' requirements.txt > requirements-linux.txt
          pip install -r requirements-linux.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        env:
          # 测试环境变量（使用 mock 值）
          LLM_API_KEY: test_key
          LLM_API_URL: https://api.deepseek.com/v1
          LLM_MODEL: deepseek-chat
          WHISPER_MODEL_PATH: /tmp/whisper
          EMBEDDING_MODEL_PATH: /tmp/embedding
          RERANKER_MODEL_PATH: /tmp/reranker
          ASR_PROVIDER: whisper
        run: |
          # 运行 API 测试
          python -m pytest test/test_api.py -v --tb=short || true
          # 运行 Agent 测试（跳过需要模型的测试）
          python -m pytest test/test_agent_e2e.py -v --tb=short -k "not test_search and not test_create" || true

  # 依赖安全检查
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety

      - name: Check dependencies
        run: |
          # 检查已知漏洞
          safety check --full-report || true
        continue-on-error: true

  # 构建检查
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # 启用 pip 缓存

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 移除 Windows 专用的 python-magic-bin
          sed '/python-magic-bin/d' requirements.txt > requirements-linux.txt
          pip install -r requirements-linux.txt

      - name: Check imports
        run: |
          # 验证核心模块可以导入
          python -c "from backend.app.core.config import settings; print('Config OK')"
          python -c "from backend.app.agent.models import IntentType; print(f'Intents: {len(IntentType.__members__)} types')"

      - name: Check Docker build
        run: |
          # 验证 Dockerfile 语法
          docker build --check . || true
        continue-on-error: true
