# 多实例部署的覆盖配置。
#
# **默认不用。** 智语的定位是单用户本地应用，日常 `docker compose up -d` 起来
# 就是单实例形态——API 直接映射端口，组件最少。这个文件只在你要开多个 API
# 副本时带上：
#
#   docker compose -f docker-compose.yml -f docker-compose.ha.yml \
#     up -d --scale zhiyu=3 --scale arq-worker-agent=2
#
# 注意：多开副本会把「实例之间互相干扰」那套复杂度重新引进来——同一会话被两个
# worker 抢、一个 worker 重启误伤另一个正在跑的运行。当前代码保留了事件流外置、
# 会话锁等机制，足以支撑；但纯为多实例存在的选主锁与运行心跳已经移除（见
# 项目文档里「单实例与多实例」那篇），真要多实例前值得先复核一遍。
#
# 它只做两件事：
#   1. 清掉 API 的宿主端口映射——多个副本绑同一个端口会直接报冲突
#   2. 起 nginx 作为唯一入口，把请求轮询到各副本（配置见 nginx/nginx.conf）

services:
  zhiyu:
    # !reset 是 Compose 的合并指令：列表默认是**追加**语义，光写 ports: []
    # 不会清掉主文件里的映射，必须显式重置。需要 Compose v2.24+。
    ports: !reset []

  # 负载均衡层。多实例下才有意义——单实例时它是纯粹多出来的一跳。
  #
  # 不用 nginx 镜像自带的默认配置：需要 resolver 做动态解析（--scale 出来的
  # 副本才能被发现）、放大 SSE 的读超时（一次 Agent 运行最长 180 秒）、
  # 关掉事件流的缓冲（否则前端收不到实时输出）。
  nginx:
    image: nginx:alpine
    ports:
      - "${PORT:-8337}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - zhiyu
    restart: unless-stopped
