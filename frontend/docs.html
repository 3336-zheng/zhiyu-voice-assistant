<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智语 - 文档管理</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <h1><span class="brand-icon">🧠</span> 智语</h1>
        <div class="navbar-nav">
            <a href="index.html">🔍 问题检索</a>
            <a href="summary.html">📝 纪要总结</a>
            <a href="docs.html" class="active">📂 文档管理</a>
        </div>
    </nav>

    <div class="container">
        <!-- MD文档上传区 -->
        <div class="card">
            <div class="card-title"><span class="icon">📤</span> 上传文档</div>
            <div class="upload-area" onclick="document.getElementById('mdFile').click()">
                <input type="file" id="mdFile" accept=".md,.txt,.pdf,.docx" onchange="handleUpload(this)">
                <p style="font-size: 32px; margin-bottom: 8px;">📁</p>
                <p style="color: var(--text-secondary); font-size: 14px;">点击选择文件（支持 .md、.txt、.pdf、.docx）</p>
                <p style="color: #B0B0C0; font-size: 12px; margin-top: 4px;">PDF / Word 会自动转为 Markdown</p>
            </div>
        </div>

        <div class="grid-2">
            <!-- 文档存储区 -->
            <div class="card">
                <div class="card-title"><span class="icon">📚</span> 文档列表</div>
                <ul id="docList" class="doc-list">
                    <li class="doc-item">
                        <span style="color: var(--text-secondary);">加载中...</span>
                    </li>
                </ul>
            </div>

            <!-- 文档预览区 -->
            <div class="card">
                <div class="card-title"><span class="icon">👁️</span> 文档预览</div>
                <div id="docPreview" class="result-area" style="min-height: 300px;">
                    <div class="empty-state">
                        <div class="empty-icon">📄</div>
                        <p>点击文档查看内容</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 提示消息 -->
    <div id="toast" class="toast" style="display: none;"></div>

    <script>
        const API_BASE = window.location.origin;

        // 页面加载时获取文档列表
        window.onload = function() {
            loadDocList();
        };

        // 加载文档列表
        async function loadDocList() {
            try {
                const res = await fetch(`${API_BASE}/api/documents/list`);
                const data = await res.json();

                const docList = document.getElementById('docList');
                if (data.files && data.files.length > 0) {
                    docList.innerHTML = data.files.map(file => `
                        <li class="doc-item">
                            <div>
                                <div class="doc-name">📄 ${file.name}</div>
                                <div class="doc-date">${file.date || ''}</div>
                            </div>
                            <div class="doc-actions">
                                <button class="btn btn-outline" onclick="viewDoc('${file.name}')">查看</button>
                                <button class="btn btn-danger" onclick="deleteDoc('${file.name}')">删除</button>
                            </div>
                        </li>
                    `).join('');
                } else {
                    docList.innerHTML = '<li class="doc-item"><div class="empty-state"><div class="empty-icon">📭</div><p>暂无文档，上传一个试试</p></div></li>';
                }
            } catch (err) {
                console.error('加载文档列表失败:', err);
            }
        }

        // 上传文档
        async function handleUpload(input) {
            const file = input.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch(`${API_BASE}/api/documents/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (res.ok) {
                    showToast(data.message || '上传成功', 'success');
                    loadDocList();
                    input.value = '';
                } else {
                    throw new Error(data.detail || '上传失败');
                }
            } catch (err) {
                showToast('上传失败: ' + err.message, 'error');
            }
        }

        // 查看文档
        async function viewDoc(filename) {
            try {
                const res = await fetch(`${API_BASE}/api/documents/view/${filename}`);
                const data = await res.json();

                if (res.ok) {
                    document.getElementById('docPreview').innerHTML = '<div class="result-content">' + renderMarkdown(data.content) + '</div>';
                } else {
                    throw new Error(data.detail || '加载失败');
                }
            } catch (err) {
                document.getElementById('docPreview').textContent = '加载失败: ' + err.message;
            }
        }

        // 删除文档
        async function deleteDoc(filename) {
            if (!confirm(`确定删除 ${filename}？`)) return;

            try {
                const res = await fetch(`${API_BASE}/api/documents/delete/${filename}`, {
                    method: 'DELETE'
                });
                const data = await res.json();

                if (res.ok) {
                    showToast('删除成功', 'success');
                    loadDocList();
                    document.getElementById('docPreview').innerHTML = '<div class="empty-state"><div class="empty-icon">📄</div><p>点击文档查看内容</p></div>';
                } else {
                    throw new Error(data.detail || '删除失败');
                }
            } catch (err) {
                showToast('删除失败: ' + err.message, 'error');
            }
        }

        // 显示提示
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = type === 'success' ? '✅' : '❌';
            toast.innerHTML = icon + ' ' + message;
            toast.className = `toast toast-${type}`;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // 轻量 Markdown 渲染
        function renderMarkdown(text) {
            if (!text) return '';
            let html = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                .replace(/^# (.+)$/gm, '<h1>$1</h1>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
                .replace(/^---$/gm, '<hr>')
                .replace(/^[*\-+] (.+)$/gm, '<li>$1</li>')
                .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
                .replace(/\n/g, '<br>');
            html = html.replace(/(<li>.*?<\/li>)(?:\s*<br>)?/g, '$1');
            html = html.replace(/((?:<li>.*?<\/li>\s*)+)/g, '<ul>$1</ul>');
            return html;
        }
    </script>
</body>
</html>
