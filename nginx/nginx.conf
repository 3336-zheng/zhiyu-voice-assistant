# 智语 API 的负载均衡层。
#
# **默认不启用。** 单实例部署（`docker compose up -d`）不需要它——只有一个
# API 进程，它直接占住 8337，多这一层只是白白多一跳。
#
# 它的用途只有一个：多实例时把请求分给各个副本。带上 override 文件即可启用：
#
#   docker compose -f docker-compose.yml -f docker-compose.ha.yml \
#     up -d --scale zhiyu=3
#
# 没有它的时候 compose 给 zhiyu 写的是固定端口映射（"8337:8337"），第二个
# 副本直接报端口占用，多实例起不来。
#
# 前端静态资源不在这里托管——它已经打进 API 镜像，由 FastAPI 自己挂在 "/"。
# 所以这个 nginx 只做一件事：把请求轮询到各个 API 副本。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # 访问日志里带上游地址。多实例下「这个请求打到了哪个副本」是最基本的
    # 排查信息——默认格式只有客户端信息，出了问题只能去翻每个副本自己的日志。
    log_format main '$remote_addr - [$time_local] "$request" $status '
                    'upstream=$upstream_addr upstream_status=$upstream_status '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Docker 内嵌 DNS。必须显式配 resolver，否则下面的变量形式 proxy_pass
    # 在启动时解析不到 zhiyu 这个名字。
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        # 后端的 MAX_FILE_SIZE 是 50MB，这里刻意放宽一倍：让应用层的校验先生效，
        # 用户看到的是后端给的错误提示，而不是 Nginx 一句干巴巴的 413。
        client_max_body_size 100m;

        # 用变量形式写 proxy_pass，只有这样才能配合上面的 resolver 做动态解析。
        # 写成 server 块里静态的 upstream 的话，Nginx 只在启动时解析一次 zhiyu
        # 这个服务名——之后 --scale 出来的副本不会被发现，副本重启换了 IP 也会
        # 继续往旧地址打。变量形式的代价是 URI 不会自动透传，必须显式写 $request_uri。
        set $backend "zhiyu:8337";

        # 一次 Agent 运行最长 180 秒，默认的 60 秒读超时会在中途掐断连接。
        # 其余端点用不到这么长，但统一设成 300 秒比按路径分两档简单。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 置空 Connection 才能让 Nginx 与上游走长连接而不是每个请求新建一条
        proxy_set_header Connection "";

        # Agent 的事件流是 SSE 长连接：开了缓冲的话前端一个字都收不到，
        # 要等到运行整个结束才一次性吐出来。后端也发了 X-Accel-Buffering: no
        # （Nginx 认这个头），这里再显式关一次——免得哪天后端改了那个头，
        # 而这里没人记得。
        location /agent/ {
            proxy_pass http://$backend$request_uri;
            proxy_buffering off;
            proxy_cache off;
        }

        location / {
            proxy_pass http://$backend$request_uri;
        }
    }
}
