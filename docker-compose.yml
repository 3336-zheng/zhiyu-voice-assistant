# 智语端侧智能语音笔记助手 Docker Compose 配置
# 使用方法：docker compose up --build
#
# Phase 5 分布式改造：MySQL（Stage 1-2）、Redis（Stage 3 起）、
# Chroma server 模式（Stage 4）均已接入，三个容器都在被应用真正使用。
# 本地直接运行 python main.py 时走 .env 里的宿主机地址；
# 容器内则由下面的 environment 覆盖为 compose 内网服务名。

# 应用容器（API 与 arq worker）共用同一套挂载、环境变量和依赖。
# 抽成锚点是因为两者必须完全一致——worker 也要读同一份 .env、连同一个 MySQL 和
# Redis、挂同一份模型；分开写的话，改一处忘另一处就是「API 能跑、worker 连不上」
# 这种半坏状态，排查起来很费劲。
x-app-volumes: &app-volumes
  # 环境变量配置文件
  - ./.env:/app/.env:ro
  # 数据持久化（数据库、上传文件、向量库、日志）
  - ./data:/app/data

x-app-environment: &app-environment
  # 容器内必须监听所有网络接口。.env 里的 HOST=127.0.0.1 是给本地直接运行
  # python main.py 用的（绑回环，不对外暴露），但在容器里绑回环意味着只有
  # 容器自己连得上——nginx 和其它实例访问时是 Connection refused。
  # 单实例时这个错误不容易察觉（本机 curl 127.0.0.1:8337 依然通，
  # 因为端口映射到宿主机后走的是容器内回环），多实例一上来就暴露。
  - HOST=0.0.0.0
  # .env 里的地址是宿主机视角（127.0.0.1:3316 / 6382 / 8001），供本地直接运行使用；
  # 容器内必须改写为 compose 内网服务名，否则 127.0.0.1 会指向容器自身。
  # 这里用插值而不是写死连接串，是为了让密码只存在于 .env 一处。
  - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-zhiyu}:${MYSQL_PASSWORD:?必须在 .env 中设置 MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-zhiyu}?charset=utf8mb4
  - REDIS_URL=redis://redis:6379/0
  # 容器内固定走 server 模式：向量库是独立容器，embedded 会去读 /app/data 下
  # 那份文件，和 chroma 容器同时写同一份索引，正是 Stage 4 要消灭的情况。
  - CHROMA_MODE=server
  - CHROMA_HOST=chroma
  - CHROMA_PORT=8000

x-app-depends: &app-depends
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy
  chroma:
    condition: service_healthy

services:
  mysql:
    image: mysql:8.0
    container_name: zhiyu-mysql
    # 中文内容必须使用 utf8mb4，否则 emoji 和部分生僻字会写入失败；
    # max-connections 为 Stage 7 多实例预留，单实例上限 30 条连接
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=300
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhiyu}
      MYSQL_USER: ${MYSQL_USER:-zhiyu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?必须在 .env 中设置 MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # 一律绑定 127.0.0.1，绝不能写成 "3316:3306"——那等同 0.0.0.0，会把数据库暴露到局域网。
    # 用 3316 而非 3306，是因为本机已有其他项目的 MySQL 占用 3306。
    # 映射到宿主机是为了让本地直接运行的 python main.py 能连上；
    # 容器内的 zhiyu 服务走 compose 内网的 mysql:3306，不经过这个映射。
    ports:
      - "127.0.0.1:3316:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      # MySQL 首次启动需要初始化数据目录，约 20-30 秒，期间不计入失败次数
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zhiyu-redis
    # 开启 AOF：Redis 承担任务队列职责，进程重启不能丢失未消费的任务
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    # 6382 避开本机其他项目已占用的 6379/6380/6381
    ports:
      - "127.0.0.1:6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  chroma:
    # 镜像版本必须与 requirements.txt 中的 chromadb 保持一致，
    # client 与 server 版本不匹配会在调用时报协议错误
    image: chromadb/chroma:1.5.9
    container_name: zhiyu-chroma
    volumes:
      # 直接挂 embedded 模式一直在用的那个目录，而不是用独立的 named volume。
      # 实测同版本（1.5.9）的 server 能直接读 PersistentClient 写出来的数据，
      # 973 个 chunk 原样可见，所以切模式不需要任何数据迁移，本地目录同时也是
      # 切回 embedded 的回退路径。
      # 注意：两种模式共用这一份文件，所以只能二选一地开，不能同时跑——
      # 同时写同一份索引正是本 Stage 要消灭的那个问题。
      - ./data/database/chromadb:/data
    # 8001 避开本机 api.tiwork.ai 占用的 8000
    ports:
      - "127.0.0.1:8001:8000"
    # 用 TCP 端口探测而非 HTTP 请求：chromadb 1.x 的健康检查路径为 /api/v2，
    # 与 0.x 的 /api/v1 不同，写死路径会在升级时静默失效。
    # 探测方式只能用 bash 的 /dev/tcp 伪设备：1.x 镜像核心已用 Rust 重写，
    # 容器内不存在 python、curl、wget、nc，仅有 sh 与 bash。
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # API 实例。不写 container_name（Compose 不允许对具名容器做 --scale），
  # 也**不直接对外暴露端口**——请求统一从 nginx 进来，由它轮询到各个副本。
  # 对外端口因此和改造前完全一样（还是 ${PORT:-8337}），使用方式不变。
  # 多开：docker compose up -d --scale zhiyu=3
  zhiyu:
    build: .
    expose:
      - "8337"
    volumes: *app-volumes
    env_file:
      - .env
    environment: *app-environment
    depends_on: *app-depends
    restart: unless-stopped

  # 负载均衡层。整个应用唯一的对外入口。
  #
  # 不用容器自带的默认配置：需要 resolver 做动态解析（--scale 出来的副本
  # 才能被发现）、放大 SSE 的读超时（一次 Agent 运行最长 180 秒）、关掉
  # 事件流的缓冲（否则前端收不到实时输出）。
  nginx:
    image: nginx:alpine
    ports:
      - "${PORT:-8337}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - zhiyu
    restart: unless-stopped

  # 索引任务的消费者。独立成进程之后，API 重启不再打断正在跑的索引，
  # worker 崩溃也不会拖垮 API；两边通过 Redis 队列和一个共享的任务表协作。
  # 可以 --scale arq-worker=3 横向扩，任务由队列保证只被一个 worker 取走。
  arq-worker:
    build: .
    command: arq backend.app.tasks.worker.WorkerSettings
    volumes: *app-volumes
    env_file:
      - .env
    environment: *app-environment
    depends_on: *app-depends
    restart: unless-stopped

  # ASR 转写专用 worker。与索引分开是因为时长差一个量级：索引是几百毫秒的短活，
  # 一次转写可能跑满 180 秒，混在一起会让短任务排在长任务后面。
  # 可以 --scale，并发上限由 ARQ_ASR_MAX_JOBS 控制，远程 API 不占本地显存。
  arq-worker-asr:
    build: .
    command: arq backend.app.tasks.worker.AsrWorkerSettings
    volumes: *app-volumes
    env_file:
      - .env
    environment: *app-environment
    depends_on: *app-depends
    restart: unless-stopped

  # Agent 运行专用 worker。运行可能跑满 180 秒且是交互式任务，
  # 与索引、转写分开排队，免得排在后台批处理后面。
  # 它也是唯一执行 Agent 的进程，API 重启不影响正在进行的对话。
  arq-worker-agent:
    build: .
    command: arq backend.app.tasks.worker.AgentWorkerSettings
    volumes: *app-volumes
    env_file:
      - .env
    environment: *app-environment
    depends_on: *app-depends
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
